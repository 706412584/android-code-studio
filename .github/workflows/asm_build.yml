name: Build Android Code Studio

on:
  push:
    branches: 
      - "dev"
      - "main" 
      - "indexing"
      - "release/**"
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
      - '.github/workflows/crowdin_contributors.yml'
  pull_request:
    branches: [ "dev" ]
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
      - '.github/workflows/crowdin_contributors.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release
      revision:
        description: '仅 Release 用：发布修订号（如 8 → 1.0.0+gh.r08 / versionCode 1029）。留空则只构建不发布。'
        required: false
        default: ''

jobs:
  build_release_apk:
    name: Build APK
    runs-on: ubuntu-latest
    # 显式声明权限：发布需要 contents:write（创建 Release + push updater.json 回写）。
    # 不依赖仓库的默认 token 权限设置，避免换个环境就静默失效。
    permissions:
      contents: write
    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}
          
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Determine Build Type Configuration
        run: |
          SELECTED_TYPE="${{ github.event.inputs.build_type }}"
          BUILD_TYPE="${SELECTED_TYPE:-Debug}"
          echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV
          echo "BUILD_TYPE_LOWER=$(echo "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

          # 发布：仅当 Release + 给了 revision 时启用。versionName/versionCode 的
          # 计算必须与 tools/publish-release.ps1 完全一致，否则 updater.json 会错、
          # 用户端更新失效：
          #   versionName = 1.0.0+gh.r<NN>   versionCode = 1021 + revision
          REV="${{ github.event.inputs.revision }}"
          if [ "$BUILD_TYPE" = "Release" ] && [ -n "$REV" ]; then
            REV_STR=$(printf '%02d' "$REV")
            VERSION_NAME="1.0.0+gh.r$REV_STR"
            VERSION_CODE=$((1021 + REV))
            echo "PUBLISH=true" >> $GITHUB_ENV
            echo "REVISION_NUM=$REV_STR" >> $GITHUB_ENV
            echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
            echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
            echo "RELEASE_TAG=v$VERSION_NAME" >> $GITHUB_ENV
            echo "发布模式：$VERSION_NAME (versionCode=$VERSION_CODE)"
          else
            # 构建模式：显式给默认值。**不能留空**——settings.gradle.kts 用
            # `System.getenv("REVISION_NUM") ?: "06"`，空串不等于 null，留空会得到
            # 版本名 `1.0.0+gh.r`（缺修订号）。显式设 06/1027 与历史默认完全一致。
            echo "PUBLISH=false" >> $GITHUB_ENV
            echo "REVISION_NUM=06" >> $GITHUB_ENV
            echo "VERSION_CODE=1027" >> $GITHUB_ENV
            echo "构建模式（不发布）"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'adopt'

      - name: Generating missing dirs
        # release 构建需要 l8_art_profile 目录**及**其中的 baseline-prof.txt 文件
        # （仓库里缺；本地发布脚本 publish-release.ps1 同样补这两样，见 CLAUDE.md）。
        # 只建目录不建文件会让 assembleRelease 失败。
        run: |
          mkdir -p core/app/build/intermediates/external_file_lib_dex_archives/debug/desugarDebugFileDependencies
          mkdir -p core/app/build/intermediates/l8_art_profile/release/l8DexDesugarLibRelease
          touch core/app/build/intermediates/l8_art_profile/release/l8DexDesugarLibRelease/baseline-prof.txt

      - name: Change Gradle wrapper permissions
        run: chmod +x ./gradlew

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v2-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 把正确的签名密钥（与已发布 r4/r5/r6 同证书的那把）还原到仓库内路径。
      # 仓库自带的 signing/signing-key.jks 是 upstream 官方密钥，其密码只存在于
      # upstream 仓库的 secret，本 fork 无法还原——用它签出的包无法覆盖安装。
      # 因此改从 SIGNING_KEYSTORE_BASE64（由 tools/setup-ci-signing.ps1 写入）还原。
      - name: Restore signing keystore
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > signing/signing-key.jks

      - name: Assemble APK
        env:
          # build.gradle.kts 的 signingConfigs.custom 读这三个环境变量。
          # **不要**设 SIGNING_STORE_FILE：build.gradle.kts 里 file() 是相对
          # core/app 项目解析的，传相对路径会变成 core/app/signing/...（错）；
          # 而默认值 keyStoreFile 已经用 ${rootProject.projectDir}/signing/...，
          # 正是 Restore 步骤写入的绝对路径。
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: androidcs
          # 发布时注入版本号（settings.gradle.kts 读 MAIN_VERSION/REVISION_NUM；
          # ProjectConfig.kt 读 PROJECT_CONFIG_KT_BASE_VERSION_CODE）。构建模式下为空，
          # 走默认 1.0.0+gh.r06 / 1027，与从前一致。
          MAIN_VERSION: "1.0.0"
          REVISION_NUM: ${{ env.REVISION_NUM }}
          PROJECT_CONFIG_KT_BASE_VERSION_CODE: ${{ env.VERSION_CODE }}
        run: |
          # Release 排除 lintVitalRelease：与本地 publish-release.ps1 一致。
          # Debug 不受影响（-x 对不存在的任务是无害的）。
          ./gradlew assemble${{ env.BUILD_TYPE }} -x lintVitalRelease

      # 立即把本次（常规版）产物复制到 staging：随后 CN 构建会复用同一
      # build/outputs 目录，是否清理异名旧产物取决于 AGP 内部行为（不可依赖）。
      # staging 让后续验签/发布/补丁都有确定输入。
      - name: Stage APKs
        run: |
          mkdir -p apk-staging
          cp core/app/build/outputs/apk/${{ env.BUILD_TYPE_LOWER }}/*.apk apk-staging/

      # CN 版：Gitee 源（国内首装全链路可达），产物带 -cn 后缀，与常规版共存。
      # 开关走 -P（gradle property）而不是环境变量：同一 job 内第二次 gradle
      # 调用复用 daemon，daemon 的 env 是首次启动时的快照，getenv 会读到旧值。
      - name: Assemble CN APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: androidcs
          MAIN_VERSION: "1.0.0"
          REVISION_NUM: ${{ env.REVISION_NUM }}
          PROJECT_CONFIG_KT_BASE_VERSION_CODE: ${{ env.VERSION_CODE }}
        run: |
          ./gradlew assemble${{ env.BUILD_TYPE }} -x lintVitalRelease -PcnMirror=true

      - name: Stage CN APKs
        run: cp core/app/build/outputs/apk/${{ env.BUILD_TYPE_LOWER }}/*-cn-*.apk apk-staging/

      - name: List APK files
        run: ls -la apk-staging/ || echo "Directory not found"

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-v8a-${{ env.BUILD_TYPE_LOWER }}
          retention-days: 7
          path: |
            apk-staging/*arm64-v8a*.apk
            !apk-staging/*-cn-*.apk
        if: always()

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-armeabi-v7a-${{ env.BUILD_TYPE_LOWER }}
          retention-days: 7
          path: |
            apk-staging/*armeabi-v7a*.apk
            !apk-staging/*-cn-*.apk
        if: always()

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-x86_64-${{ env.BUILD_TYPE_LOWER }}
          retention-days: 7
          path: |
            apk-staging/*x86_64*.apk
            !apk-staging/*-cn-*.apk
        if: always()

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-universal-${{ env.BUILD_TYPE_LOWER }}
          retention-days: 7
          path: |
            apk-staging/*universal*.apk
            !apk-staging/*-cn-*.apk
        if: always()

      # ---- CN 版产物（Gitee 源）----
      - name: Upload CN arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-v8a-cn-${{ env.BUILD_TYPE_LOWER }}
          retention-days: 7
          path: apk-staging/*arm64-v8a-cn*.apk
        if: always()

      - name: Upload CN armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-armeabi-v7a-cn-${{ env.BUILD_TYPE_LOWER }}
          retention-days: 7
          path: apk-staging/*armeabi-v7a-cn*.apk
        if: always()

      # ---- 发布（仅 Release + 给了 revision 时）----
      # 手动触发发布，语义与 tools/publish-release.ps1 一致。四条硬约束由脚本保证，
      # 这里逐条复刻：tag=v<versionName>、资产名含 versionName、updater.json 的
      # versionCode 与 APK 一致、证书是已发布那把（下面显式验签）。
      - name: Verify APK signature cert
        if: env.PUBLISH == 'true'
        run: |
          # 常规版 + CN 版（4 个包）全部验签：任一个用错证书用户都无法覆盖安装。
          # 用 apksigner 核对证书指纹。
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          EXPECTED="83ABB7381685A06DBDAE877DED4A207F4919C1DA"
          for APK in apk-staging/*.apk; do
            test -f "$APK" || { echo "缺少产物: $APK"; exit 1; }
            SHA1=$("$APKSIGNER" verify --print-certs "$APK" | grep -oiE 'SHA-1 digest: [0-9a-f]{40}' | head -1 | grep -oE '[0-9a-f]{40}' | tr 'a-f' 'A-F')
            echo "$APK 证书 SHA-1: $SHA1"
            [ "$SHA1" = "$EXPECTED" ] || { echo "证书不匹配！期望 $EXPECTED"; exit 1; }
          done
          echo "全部证书校验通过"

      # ---- 热更新补丁生成 ----
      # 用上一版本 APK 作为 base、本次构建的 APK 作为 new，生成增量补丁，作为 Release 资产上传。
      #
      # 四个关键点：
      # 1. patch-cli 从 Maven Central 取 -all 分类器（自包含依赖），不提交 16MB 二进制进仓库。
      # 2. **必须规范化 dex 名**：patch-cli 沿用 base 的 dex 名（ACS 是 classes8/classes12），
      #    而 ART 只按连续的 classes.dex → classes2.dex … 查找，跳号即补丁静默失效。
      #    见 tools/hotupdate-normalize-patch.py 的说明。
      # 3. 输出 baseVersionCode：App 端要求「补丁 base == 当前安装版本」才应用，
      #    这个值写进 updater.json 的 patch 块。
      # 4. **补丁生成失败绝不能让发布失败**：补丁是可选能力，整包更新始终可用。
      #    任何一步出错都走 `generated=false` 分支——步骤内不 `set -e`，
      #    并对 patch-cli / 规范化显式判错。
      - name: Generate hot-update patch
        if: env.PUBLISH == 'true'
        id: patch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          fail() { echo "跳过补丁生成：$1"; echo "generated=false" >> "$GITHUB_OUTPUT"; exit 0; }

          # 含资源变更的补丁会被 hotupdate-normalize-patch.py 拒绝（exit 1 → fail()），
          # 此时 generated=false：Create Release 不带补丁资产、Sync updater.json 移除
          # patch 块，用户自动回退到整包更新。原因见该脚本的模块文档：补丁整体替换
          # resources.arsc，而资源 ID 跨版本会漂移（r11→r12 实测 981 个 ID 变化），
          # 未被差分 dex 覆盖的代码会引用到错误资源，界面文字错乱。

          # 1.5.2 起支持 dex 版本 038（INVOKE_POLYMORPHIC 解析与写入）——
          # 1.4.0/1.5.1 对 ACS 的 Kotlin 2.1 产物必报 truncated，不能降级。
          PATCH_CLI_URL="https://repo1.maven.org/maven2/io/github/706412584/patch-cli/1.5.2/patch-cli-1.5.2-all.jar"
          curl -fsSL -o patch-cli.jar "$PATCH_CLI_URL" || fail "patch-cli 下载失败"

          # 从 staging 取常规版（不带 -cn）——补丁只对常规版生成；CN 版跳过
          # 应用内更新检查，不需要补丁。
          NEW_APK="apk-staging/android-code-studio-arm64-v8a-$VERSION_NAME.apk"
          [ -f "$NEW_APK" ] || fail "找不到本次构建的 APK: $NEW_APK"

          # 上一版本 = 修订号最大的 `v1.0.0+gh.rNN` Release（本次 Release 还没建）。
          #
          # **不能用 `gh release view`（无参数）**：它返回仓库「最新」Release，而本仓库
          # 还有 dart-sdk / apt-mirror-backup 等非版本 Release（无 APK 资产），
          # 会拿到 dart-sdk 直接导致补丁生成静默跳过（实测踩过）。
          # 改为按 tag 模式过滤 + 修订号排序取最大，只认真正的版本发布。
          PREV_REV=$(gh release list --limit 100 --json tagName -q '.[].tagName' 2>/dev/null \
            | grep -E '^v1\.0\.0\+gh\.r[0-9]+$' \
            | sed -E 's/^v1\.0\.0\+gh\.r0*([0-9]+)$/\1/' \
            | sort -n | tail -1)
          [ -n "$PREV_REV" ] || fail "没有上一个版本 Release"
          PREV_TAG="v1.0.0+gh.r$(printf '%02d' "$PREV_REV")"
          echo "上一版本：$PREV_TAG"

          mkdir -p patch-work
          gh release download "$PREV_TAG" \
            --pattern "android-code-studio-arm64-v8a-*.apk" \
            --dir patch-work 2>/dev/null || fail "上一版本 $PREV_TAG 无 arm64 APK 资产"

          # 显式排除 -cn 资产：发布含两版 APK 后，通配会同时命中 CN 包，
          # 补丁的 base 必须是常规包（CN 版内容不同，差分结果会错）。
          BASE_APK=$(ls patch-work/android-code-studio-arm64-v8a-*.apk 2>/dev/null | grep -v -- '-cn-' | head -1)
          [ -n "$BASE_APK" ] || fail "上一版本资产为空"
          echo "base=$BASE_APK  new=$NEW_APK"

          # 从 base APK 读 versionCode —— App 端就是拿这个值和当前安装版本比对的，
          # 不能靠猜（tag 名与 versionCode 没有可推导关系）。
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          BASE_VC=$("$AAPT2" dump badging "$BASE_APK" 2>/dev/null | grep -oE "versionCode='[0-9]+'" | head -1 | grep -oE "[0-9]+")
          [ -n "$BASE_VC" ] || fail "无法从 base APK 读取 versionCode"
          echo "base versionCode=$BASE_VC"

          # 不签名：ACS 发布包用公开 debug 密钥，签名校验无防护价值（见 CLAUDE.md）。
          java -jar patch-cli.jar -b "$BASE_APK" -n "$NEW_APK" -o patch-work/raw-patch.zip \
            || fail "patch-cli 生成失败"

          python3 tools/hotupdate-normalize-patch.py \
            patch-work/raw-patch.zip "patch-work/acs-hotupdate-$VERSION_NAME.zip" \
            || fail "dex 规范化失败"

          PATCH_FILE="patch-work/acs-hotupdate-$VERSION_NAME.zip"
          SHA=$(sha256sum "$PATCH_FILE" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$PATCH_FILE")
          echo "补丁: $PATCH_FILE ($SIZE bytes, sha256=$SHA)"
          echo "generated=true" >> "$GITHUB_OUTPUT"
          echo "path=$PATCH_FILE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "base_version_code=$BASE_VC" >> "$GITHUB_OUTPUT"

      # ---- CN 版热更新补丁 ----
      # CN 版与常规版的 dex 不同（CN_MIRROR 常量内联差异），**不能**共用补丁——
      # 常规补丁打到 CN 包上会把 CN 语义的 dex 换成常规语义（静默注入错误 dex）。
      # 因此单独生成：base = 上一版的 CN APK，new = 本次 CN APK。
      # 首个含 CN 包的 Release（r09）没有上一版 CN APK，此时跳过（generated=false），
      # 从 r09 → r10 起补丁链成立。
      - name: Generate CN hot-update patch
        if: env.PUBLISH == 'true'
        id: cn_patch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          fail() { echo "跳过 CN 补丁生成：$1"; echo "generated=false" >> "$GITHUB_OUTPUT"; exit 0; }

          # 复用常规补丁步骤下载的 jar（同 workspace）；缺失时重下。
          PATCH_CLI_URL="https://repo1.maven.org/maven2/io/github/706412584/patch-cli/1.5.2/patch-cli-1.5.2-all.jar"
          [ -f patch-cli.jar ] || curl -fsSL -o patch-cli.jar "$PATCH_CLI_URL" || fail "patch-cli 下载失败"

          NEW_APK="apk-staging/android-code-studio-arm64-v8a-cn-$VERSION_NAME.apk"
          [ -f "$NEW_APK" ] || fail "找不到本次构建的 CN APK: $NEW_APK"

          # 上一版本（与常规补丁同一查找逻辑）。
          PREV_REV=$(gh release list --limit 100 --json tagName -q '.[].tagName' 2>/dev/null \
            | grep -E '^v1\.0\.0\+gh\.r[0-9]+$' \
            | sed -E 's/^v1\.0\.0\+gh\.r0*([0-9]+)$/\1/' \
            | sort -n | tail -1)
          [ -n "$PREV_REV" ] || fail "没有上一个版本 Release"
          PREV_TAG="v1.0.0+gh.r$(printf '%02d' "$PREV_REV")"

          mkdir -p patch-work-cn
          # 上一版没有 CN APK（首个 CN Release）→ 无 base，跳过。下载失败即此情形。
          gh release download "$PREV_TAG" \
            --pattern "android-code-studio-arm64-v8a-cn-*.apk" \
            --dir patch-work-cn 2>/dev/null || fail "上一版本 $PREV_TAG 无 CN APK（首个 CN Release，跳过）"

          BASE_APK=$(ls patch-work-cn/android-code-studio-arm64-v8a-cn-*.apk 2>/dev/null | head -1)
          [ -n "$BASE_APK" ] || fail "上一版本 CN 资产为空"
          echo "CN base=$BASE_APK  new=$NEW_APK"

          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          BASE_VC=$("$AAPT2" dump badging "$BASE_APK" 2>/dev/null | grep -oE "versionCode='[0-9]+'" | head -1 | grep -oE "[0-9]+")
          [ -n "$BASE_VC" ] || fail "无法从 CN base APK 读取 versionCode"
          echo "CN base versionCode=$BASE_VC"

          java -jar patch-cli.jar -b "$BASE_APK" -n "$NEW_APK" -o patch-work-cn/raw-patch.zip \
            || fail "patch-cli 生成失败"

          python3 tools/hotupdate-normalize-patch.py \
            patch-work-cn/raw-patch.zip "patch-work-cn/acs-hotupdate-cn-$VERSION_NAME.zip" \
            || fail "dex 规范化失败"

          PATCH_FILE="patch-work-cn/acs-hotupdate-cn-$VERSION_NAME.zip"
          SHA=$(sha256sum "$PATCH_FILE" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$PATCH_FILE")
          echo "CN 补丁: $PATCH_FILE ($SIZE bytes, sha256=$SHA)"
          echo "generated=true" >> "$GITHUB_OUTPUT"
          echo "path=$PATCH_FILE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "base_version_code=$BASE_VC" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 从 staging 取资产（常规版 + CN 版；build/outputs 可能被 CN 构建清理）。
          APK_DIR="apk-staging"
          # 有 whatsnew/<versionName>.md 就用它作 Release notes（updater.json 的
          # changelog 也指向同一文件）；没有则退回占位说明。
          NOTES_FILE="whatsnew/$VERSION_NAME.md"
          if [ -f "$NOTES_FILE" ]; then
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          else
            echo "警告：$NOTES_FILE 不存在，使用占位说明"
            NOTES_ARGS=(--notes "Release $VERSION_NAME")
          fi
          # 补丁资产按条件附加。用数组而不是内联三元：条件为空时会多传一个空参数，
          # gh 会把它当成不存在的文件报错。
          ASSET_ARGS=()
          if [ "${{ steps.patch.outputs.generated }}" = "true" ]; then
            ASSET_ARGS+=("${{ steps.patch.outputs.path }}")
          fi
          if [ "${{ steps.cn_patch.outputs.generated }}" = "true" ]; then
            ASSET_ARGS+=("${{ steps.cn_patch.outputs.path }}")
          fi

          # CN 包由前置的 Assemble CN APK 步骤产出（必需步骤，失败会中断 job），
          # 此处直接作为资产传入。
          gh release create "$RELEASE_TAG" \
            --target "${{ github.ref_name }}" \
            --title "$RELEASE_TAG" \
            "${NOTES_ARGS[@]}" \
            "$APK_DIR/android-code-studio-arm64-v8a-$VERSION_NAME.apk" \
            "$APK_DIR/android-code-studio-armeabi-v7a-$VERSION_NAME.apk" \
            "$APK_DIR/android-code-studio-arm64-v8a-cn-$VERSION_NAME.apk" \
            "$APK_DIR/android-code-studio-armeabi-v7a-cn-$VERSION_NAME.apk" \
            "${ASSET_ARGS[@]}"

      - name: Sync updater.json
        if: env.PUBLISH == 'true'
        env:
          PATCH_GENERATED: ${{ steps.patch.outputs.generated }}
          PATCH_SHA256: ${{ steps.patch.outputs.sha256 }}
          PATCH_BASE_VERSION_CODE: ${{ steps.patch.outputs.base_version_code }}
        run: |
          # 应用内更新（TomIDEUpdater）读 updater.json 的 baseUrl/apkUrl 拼下载地址，
          # 因此 baseVersionCode 必须等于 APK 的 versionCode，否则用户每次启动都误报更新。
          python3 - "$VERSION_NAME" "$VERSION_CODE" "$GITHUB_REPOSITORY" <<'PY'
          import json, os, sys
          version_name, version_code, repo = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          p = 'updater.json'
          with open(p, encoding='utf-8-sig') as f:
              data = json.load(f)
          data['baseVersionCode'] = version_code
          data['baseVersionName'] = version_name
          for abi in ('armeabi-v7a', 'arm64-v8a'):
              data['variants'][abi]['versionCode'] = version_code
              data['variants'][abi]['versionName'] = version_name
          data['changelog'] = f"https://raw.githubusercontent.com/{repo}/refs/heads/dev/whatsnew/{version_name}.md"

          # patch 块：App 端 TomIDEUpdater 用它判断补丁是否适用于当前安装。
          # - versionCode：装了补丁后达到的版本（与整包同一坐标系）。
          # - baseVersionCode：生成补丁时使用的 base 版本（即上一个 Release 的版本）。
          #   App 端要求它 == 当前安装版本才应用——补丁是「上一版 → 本版」的增量，
          #   装到别的版本上会静默注入错误 dex。这个字段是必需的。
          # 没生成补丁时**移除**该块，避免旧补丁信息残留导致反复提示同一个补丁。
          if os.environ.get('PATCH_GENERATED') == 'true':
              data['patch'] = {
                  'versionCode': version_code,
                  'versionName': version_name,
                  'baseVersionCode': int(os.environ.get('PATCH_BASE_VERSION_CODE', '0')),
                  'patchUrl': f"https://github.com/{repo}/releases/download/v{version_name}/acs-hotupdate-{version_name}.zip",
                  'sha256': os.environ.get('PATCH_SHA256', ''),
              }
              print(f"patch -> {version_name} (base={data['patch']['baseVersionCode']})")
          else:
              data.pop('patch', None)
              print("无补丁，已移除 patch 块")

          with open(p, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=4)
          print(f"updater.json -> {version_name} / {version_code}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updater.json
          git commit -m "chore(release): $VERSION_NAME"
          git push origin HEAD:${{ github.ref_name }}

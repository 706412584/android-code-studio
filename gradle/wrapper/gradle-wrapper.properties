# Gradle 版本与 AGP 的对应关系（改这里必须同步改 gradle/libs.versions.toml 的 agp）：
#   Gradle 9.6.1  ⇔  AGP 9.2.0   （当前）
#   Gradle 8.13   ⇔  AGP 8.13.0
#
# 为什么必须是 9.6.x：AGP 9.2.0 硬校验最低 Gradle 版本（原话
# "Minimum supported Gradle version is 9.4.1"），AGP 9.5.1 要求 9.6.0。
# 升级 AGP 前先确认它 VersionCheckPlugin 里写的最低版本。
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.1-bin.zip
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

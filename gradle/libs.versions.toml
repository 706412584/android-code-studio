# 构建健康四件套（2026-10-17 接入）。运行方式：
# - dependency-analysis：揪出未使用/配置错/该直接声明的依赖。./gradlew buildHealth（默认 warn 不失败）
# - doctor：构建体检（JAVA_HOME 一致性、GC、下载/缓存速度等），随任意构建打印建议
# - version-catalog-update：libs.versions.toml 升级。./gradlew versionCatalogUpdate（会重排 toml）
# - test-retry：失败测试自动重试（AI 写的测试偶有时序 flake）。仅重试仍失败才算失败
dependency-analysis = "com.autonomousapps.dependency-analysis:3.19.2"
detekt = "io.gitlab.arturbosch.detekt:1.23.6"
doctor = "com.osacky.doctor:0.12.0"
io-gitlab-arturbosch-detekt = "io.gitlab.arturbosch.detekt:1.22.0"
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# 覆盖率（Kotlin 原生 JaCoCo 替代）。用途：本仓库有 1744 项单测，却没有覆盖率视图——
# AI 改完代码后「哪些分支没被测到」无从得知。kover 生成的 HTML 报告按类/分支标红。
kover = "org.jetbrains.kotlinx.kover:0.9.11"
protobuf = "com.google.protobuf:0.9.4"
test-retry = "org.gradle.test-retry:1.6.6"
version-catalog-update = "nl.littlerobots.version-catalog-update:1.1.1"

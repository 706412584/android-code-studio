## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Wed Feb 02 13:50:55 IST 2022
org.gradle.jvmargs=-Xmx4096M \
  -Dkotlin.daemon.jvm.options\="-Xmx4096M" \
  -XX:+HeapDumpOnOutOfMemoryError \
  --add-opens java.base/java.lang=ALL-UNNAMED \
  --add-opens java.base/java.util=ALL-UNNAMED \
  --add-opens java.base/java.io=ALL-UNNAMED
android.useAndroidX=true
android.enableJetifier=false
android.jetifier.ignorelist=common-30.2.2.jar

# TODO : Migrate
android.nonTransitiveRClass=false

# 热更新兼容：R 字段必须是 final（编译期内联常量）。
#
# AGP 8 默认 nonFinalResIds=true，R 字段变为非 final，代码用 sget 在**运行时**
# 查找字段。热更新场景下这会导致崩溃：R 类可能在补丁注入前就被加载并缓存
# （base.apk 的版本，不含新增字段），新代码访问新字段时抛
# NoSuchFieldError（实测：设置页 ai_agent_battery_title）。
#
# 设 false 恢复 Tinker 时代的默认行为——R 字段 final、编译期内联为字面量，
# 新代码直接内联新 ID，不依赖运行时 R 类（实测字节码从 sget 变 const）。
android.nonFinalResIds=false

systemProp.https.protocols=TLSv1,TLSv1.1,TLSv1.2
org.gradle.caching=true
# org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.daemon=true
android.r8.version=8.6.17
## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Wed Feb 02 13:50:55 IST 2022
org.gradle.jvmargs=-Xmx4096M \
  -Dkotlin.daemon.jvm.options\="-Xmx4096M" \
  -XX:+HeapDumpOnOutOfMemoryError \
  --add-opens java.base/java.lang=ALL-UNNAMED \
  --add-opens java.base/java.util=ALL-UNNAMED \
  --add-opens java.base/java.io=ALL-UNNAMED
android.useAndroidX=true
android.enableJetifier=false
android.jetifier.ignorelist=common-30.2.2.jar

# TODO : Migrate
android.nonTransitiveRClass=false

# 热更新兼容：R 字段必须是 final（编译期内联常量）。
#
# AGP 8 默认 nonFinalResIds=true，R 字段变为非 final，代码用 sget 在**运行时**
# 查找字段。热更新场景下这会导致崩溃：R 类可能在补丁注入前就被加载并缓存
# （base.apk 的版本，不含新增字段），新代码访问新字段时抛
# NoSuchFieldError（实测：设置页 ai_agent_battery_title）。
#
# 设 false 恢复 Tinker 时代的默认行为——R 字段 final、编译期内联为字面量，
# 新代码直接内联新 ID，不依赖运行时 R 类（实测字节码从 sget 变 const）。
android.nonFinalResIds=false

# compileSdk 37 的「未被 AGP 支持」警告抑制。（AGP 9.2.0 起 HIGHEST_SUPPORTED_API=37，
# 这条已不再触发，保留无害——回退到 AGP 8.13.0 时仍需要它。可删。）
android.suppressUnsupportedCompileSdk=37.0,37.2

# ---- AGP 9 兼容开关 ----
#
# AGP 9 默认开启内置 Kotlin（builtInKotlin）与新 DSL（newDsl），带来两处对本项目
# 不兼容的强制迁移：
#
#   1) 内置 Kotlin 时 `org.jetbrains.kotlin.android` 插件被禁止，而全项目 43 个
#      模块都在用它加载 Kotlin 编译；
#   2) 内置 Kotlin 与 `kotlin-kapt` 不兼容（"The 'org.jetbrains.kotlin.kapt' plugin
#      is not compatible with built-in Kotlin support"），而项目有 39 处 kapt
#      （Glide / auto-service / eventbus 注解处理器）——迁 KSP 是大工程。
#
# AGP 9 的错误信息本身给出了官方绕过方式（原文：「Or set the Gradle property
# 'android.builtInKotlin=false' and 'android.newDsl=false' to temporarily bypass」）。
# 这里采用它：保持原有 kotlin-android + kapt 写法不变，降低一次性改动面。
# 待日后单独做 kapt→KSP 迁移时，再一并切到内置 Kotlin。
android.builtInKotlin=false
android.newDsl=false

systemProp.https.protocols=TLSv1,TLSv1.1,TLSv1.2
org.gradle.caching=true
# org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.daemon=true
android.r8.version=8.6.17